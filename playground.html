<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playground — Fernando García</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="assets/js/galaxy.js?v=7" defer></script>
    <script src="assets/js/orbit.js?v=13" defer></script>
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        /* One palette: the playground is always dark, like the album. */
        :root {
            --bg:        #160C06;
            --bg-2:      #1F1108;
            --bg-card:   #2A1A0D;
            --rust:      #D97757;
            --rust-dark: #E8916E;
            --rust-light:#F0A882;
            --rust-dim:  rgba(217,119,87,0.12);
            --rust-alpha:rgba(217,119,87,0.12);
            --text:      #F2EAE0;
            --text-2:    #C4A48A;
            --text-3:    #896653;
            --border:    rgba(217,119,87,0.18);
            --nav-bg:    rgba(22,12,6,0.92);
            --mono: 'JetBrains Mono', monospace;
            --heading: 'Space Grotesk', sans-serif;
            --body: 'Inter', sans-serif;
            --hand: 'Covered By Your Grace', cursive;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        nav {
            position: relative;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease, border-color 0.4s ease;
            flex-shrink: 0;
        }
        .nav-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 1.2rem;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-back {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s ease;
            letter-spacing: 0.02em;
        }
        .nav-back:hover { color: var(--rust); }
        .nav-back svg { width: 14px; height: 14px; }
        .nav-title {
            font-family: var(--hand);
            font-size: 1.6rem;
            color: var(--rust);
            letter-spacing: 0.01em;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-2);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            color: var(--text-3);
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .nav-btn:hover { border-color: var(--rust); color: var(--rust); }
        .nav-btn.active { background: var(--rust-dim); border-color: var(--rust); color: var(--rust); }

        /* Sound wave icon (SVG inside button) */
        .nav-btn svg {
            width: 16px; height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ── The black hole from the home page, dimmed, behind the whole game ── */
        #space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }
        html.space-live #space { opacity: 0.44; }
        html.no-webgl #space { display: none; }

        /* ── Game canvas — fills remaining space, transparent so the hole shows through ── */
        .game-area {
            flex: 1;
            position: relative;
            z-index: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .game-area canvas {
            position: absolute; inset: 0;
            display: block;
            width: 100%;
            height: 100%;
        }
        #gameTerrain { z-index: 1; }
        #gameCanvas { z-index: 2; }
        /* Title and prompt live in the DOM: crisp type, and the canvas keeps to the scene */
        .game-hud {
            position: absolute; left: 0; right: 0; top: 15%;
            z-index: 3; text-align: center; pointer-events: none;
            padding: 0 1.2rem;
        }
        .game-hud h2 {
            font-family: var(--heading); font-weight: 600;
            font-size: clamp(1.5rem, 4.4vh, 2.2rem); color: var(--text);
            letter-spacing: -0.01em; margin-bottom: 0.5rem;
        }
        .game-hud p {
            font-family: var(--mono); font-size: clamp(0.62rem, 1.6vh, 0.78rem);
            letter-spacing: 0.14em; color: var(--text-3);
        }
        /* A phone held upright has no room to fly: ask for the long side. */
        .rotate-note {
            position: absolute; inset: 0; z-index: 5; display: none;
            flex-direction: column; align-items: center; justify-content: center; gap: 1rem;
            text-align: center; padding: 0 2rem;
            background: rgba(22, 12, 6, 0.82);
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
        }
        body.needs-rotate .rotate-note { display: flex; }
        body.needs-rotate .game-hud { display: none !important; }
        .rotate-note svg { width: 54px; height: 54px; color: var(--rust); animation: tipOver 2.6s ease-in-out infinite; }
        .rotate-note h2 { font-family: var(--heading); font-weight: 600; font-size: 1.35rem; color: var(--text); }
        .rotate-note p { font-family: var(--mono); font-size: 0.68rem; letter-spacing: 0.14em; color: var(--text-3); text-transform: uppercase; }
        @keyframes tipOver {
            0%, 45% { transform: rotate(0deg); }
            65%, 92% { transform: rotate(-90deg); }
            100% { transform: rotate(0deg); }
        }
        @media (prefers-reduced-motion: reduce) { .rotate-note svg { animation: none; transform: rotate(-90deg); } }

        /* ── Geometric Swahili pattern (from Roho) ── */
        .geo-corner {
            position: absolute;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }
        .geo-corner.top-left { top: 8px; left: 8px; }
        .geo-corner.bottom-right { bottom: 8px; right: 8px; transform: rotate(180deg); }
        .geo-corner .geo-diamond {
            width: 8px; height: 8px;
            background: var(--rust);
            transform: rotate(45deg);
            display: inline-block;
            margin: 2px;
        }
        .geo-corner .geo-diamond.sm { width: 5px; height: 5px; }

        /* ── Score bar at bottom ── */
        .score-bar {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            padding: 0.4rem 1.2rem;
            background: var(--bg-2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            color: var(--text-3);
            text-transform: uppercase;
            transition: background 0.4s ease, border-color 0.4s ease;
            gap: 1rem;
        }
        .score-bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #gameScore { flex-shrink: 0; }
    </style>
</head>
<body>

    <canvas id="space" data-ambient data-count="17000" data-dpr="1.15" aria-hidden="true"></canvas>

    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                portfolio
            </a>
            <span class="nav-title">Playground</span>
            <div class="nav-controls">
                <button class="nav-btn" id="muteBtn" aria-label="Toggle sound">
                    <svg id="soundOn" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
                    <svg id="soundOff" viewBox="0 0 24 24" style="display:none"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <div class="game-area" id="gameArea">
        <div class="geo-corner top-left">
            <span class="geo-diamond sm"></span>
            <span class="geo-diamond"></span>
            <span class="geo-diamond sm"></span>
        </div>
        <div class="geo-corner bottom-right">
            <span class="geo-diamond sm"></span>
            <span class="geo-diamond"></span>
            <span class="geo-diamond sm"></span>
        </div>
        <canvas id="gameTerrain"></canvas>
        <canvas id="gameCanvas"></canvas>
        <div class="game-hud" id="gameHud" aria-hidden="true"><h2 id="hudTitle">Orbit</h2><p id="hudHint">HOLD SPACE TO FLY · AVOID THE ROCKS</p></div>
        <div class="rotate-note" id="rotateNote" role="status">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18.5h2"/>
            </svg>
            <h2>Turn your phone</h2>
            <p>Orbit needs the long side</p>
        </div>
    </div>

    <div class="score-bar">
        <span id="gameScoreBar">hold space to fly · avoid the rocks</span>
        <span id="gameScore"></span>
    </div>

    <script>
    // The black hole reads the theme off <html>: this page has one, warm on black.
    document.documentElement.classList.add('dark', 'claude-mode');
    document.body.classList.add('dark');
    </script>

    <!-- Anti-copy protection -->
    <script>
    (function(){
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 'u') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return; }
        });
        if (window.top !== window.self) { window.top.location = window.self.location; }
    })();
    </script>

</body>
</html>
