<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playground — Fernando García</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="assets/js/galaxy.js?v=6" defer></script>
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #FAF6F1;
            --bg-2:      #F2EBE2;
            --bg-card:   #EFE7DC;
            --rust:      #D97757;
            --rust-dark: #C4633F;
            --rust-light:#F0A882;
            --rust-dim:  rgba(217,119,87,0.15);
            --rust-alpha:rgba(217,119,87,0.12);
            --text:      #2D1A0E;
            --text-2:    #7A5C48;
            --text-3:    #A8866E;
            --border:    rgba(217,119,87,0.2);
            --nav-bg:    rgba(250,246,241,0.88);
            --mono: 'JetBrains Mono', monospace;
            --heading: 'Space Grotesk', sans-serif;
            --body: 'Inter', sans-serif;
            --hand: 'Covered By Your Grace', cursive;
        }

        .dark {
            --bg:        #160C06;
            --bg-2:      #1F1108;
            --bg-card:   #2A1A0D;
            --rust:      #D97757;
            --rust-dark: #E8916E;
            --rust-light:#F0A882;
            --rust-dim:  rgba(217,119,87,0.12);
            --rust-alpha:rgba(217,119,87,0.12);
            --text:      #F2EAE0;
            --text-2:    #C4A48A;
            --text-3:    #896653;
            --border:    rgba(217,119,87,0.18);
            --nav-bg:    rgba(22,12,6,0.92);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        nav {
            position: relative;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease, border-color 0.4s ease;
            flex-shrink: 0;
        }
        .nav-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 1.2rem;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-back {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s ease;
            letter-spacing: 0.02em;
        }
        .nav-back:hover { color: var(--rust); }
        .nav-back svg { width: 14px; height: 14px; }
        .nav-title {
            font-family: var(--hand);
            font-size: 1.6rem;
            color: var(--rust);
            letter-spacing: 0.01em;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-2);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            color: var(--text-3);
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .nav-btn:hover { border-color: var(--rust); color: var(--rust); }
        .nav-btn.active { background: var(--rust-dim); border-color: var(--rust); color: var(--rust); }

        /* Sound wave icon (SVG inside button) */
        .nav-btn svg {
            width: 16px; height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ── The black hole from the home page, dimmed, behind the whole game ── */
        #space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }
        html.space-live #space { opacity: 0.44; }
        html.no-webgl #space { display: none; }

        /* ── Game canvas — fills remaining space, transparent so the hole shows through ── */
        .game-area {
            flex: 1;
            position: relative;
            z-index: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .game-area canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Geometric Swahili pattern (from Roho) ── */
        .geo-corner {
            position: absolute;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }
        .geo-corner.top-left { top: 8px; left: 8px; }
        .geo-corner.bottom-right { bottom: 8px; right: 8px; transform: rotate(180deg); }
        .geo-corner .geo-diamond {
            width: 8px; height: 8px;
            background: var(--rust);
            transform: rotate(45deg);
            display: inline-block;
            margin: 2px;
        }
        .geo-corner .geo-diamond.sm { width: 5px; height: 5px; }

        /* ── Score bar at bottom ── */
        .score-bar {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            padding: 0.4rem 1.2rem;
            background: var(--bg-2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            color: var(--text-3);
            text-transform: uppercase;
            transition: background 0.4s ease, border-color 0.4s ease;
            gap: 1rem;
        }
        .score-bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #gameScore { flex-shrink: 0; }
    </style>
</head>
<body>

    <canvas id="space" data-ambient data-count="26000" aria-hidden="true"></canvas>

    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                portfolio
            </a>
            <span class="nav-title">Playground</span>
            <div class="nav-controls">
                <button class="nav-btn" id="muteBtn" aria-label="Toggle sound">
                    <svg id="soundOn" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
                    <svg id="soundOff" viewBox="0 0 24 24" style="display:none"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
                <button class="nav-btn" id="darkToggle" aria-label="Toggle dark mode">&#x1F319;</button>
            </div>
        </div>
    </nav>

    <div class="game-area" id="gameArea">
        <div class="geo-corner top-left">
            <span class="geo-diamond sm"></span>
            <span class="geo-diamond"></span>
            <span class="geo-diamond sm"></span>
        </div>
        <div class="geo-corner bottom-right">
            <span class="geo-diamond sm"></span>
            <span class="geo-diamond"></span>
            <span class="geo-diamond sm"></span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="score-bar">
        <span id="gameScoreBar">hold space to fly · avoid the rocks</span>
        <span id="gameScore"></span>
    </div>

    <!-- Dark mode toggle -->
    <script>
    (function(){
        const btn = document.getElementById('darkToggle');
        const root = document.documentElement;
        // Dark is always the default; the toggle only changes this visit. The black hole reads these
        // classes off <html>, so it turns with the page: warm on black, ink and rust on white.
        function apply(dark) {
            document.body.classList.toggle('dark', dark);
            root.classList.toggle('dark', dark);
            root.classList.toggle('light', !dark);
            root.classList.add('claude-mode');
            btn.innerHTML = dark ? '&#x2600;' : '&#x1F319;';
        }
        apply(true);
        btn.addEventListener('click', () => apply(!document.body.classList.contains('dark')));
    })();
    </script>

    <!-- Anti-copy protection -->
    <script>
    (function(){
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 'u') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return; }
        });
        if (window.top !== window.self) { window.top.location = window.self.location; }
    })();
    </script>

    <!-- Orbit — fly the rocket past the rocks; the black hole watches -->
    <script>
    (function () {
        'use strict';
        var wrap = document.getElementById('gameArea');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var bar = document.getElementById('gameScoreBar');
        var scoreEl = document.getElementById('gameScore');
        var muteBtn = document.getElementById('muteBtn');
        var soundOn = document.getElementById('soundOn');
        var soundOff = document.getElementById('soundOff');

        /* ── Canvas ─────────────────────────────────────────────────── */
        var DPR = 1, W = 0, H = 0;
        function resize() {
            var r = wrap.getBoundingClientRect();
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = r.width; H = r.height;
            canvas.width = Math.max(1, Math.round(W * DPR));
            canvas.height = Math.max(1, Math.round(H * DPR));
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            buildTerrain();
        }
        window.addEventListener('resize', resize);

        function css(name, fallback) {
            var v = getComputedStyle(document.body).getPropertyValue(name).trim();
            return v || fallback;
        }
        var TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        var GO = TOUCH ? 'tap to fly again' : 'press space to fly again';
        function rand(a, b) { return a + Math.random() * (b - a); }
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

        /* ── Sound: a thrust that breathes, a chime, a crash ─────────── */
        var muted = false, actx = null, thrustGain = null;
        var ALBUM = ['Nashukuru.mp3', 'Kuwa Hapa Sa.mp3', 'Kuwa Hapa Sa V2.mp3', 'Tiririka.mp3'];
        var trackIdx = 0, musicStarted = false;
        var bgMusic = new Audio(ALBUM[0]);
        bgMusic.volume = 0.42;
        bgMusic.addEventListener('ended', function () {
            trackIdx = (trackIdx + 1) % ALBUM.length;
            bgMusic.src = ALBUM[trackIdx];
            if (!muted && state === 'running') bgMusic.play().catch(function () {});
        });
        function audio() {
            if (actx) return actx;
            try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
            var n = actx.sampleRate * 2, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
            for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
            var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
            var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
            thrustGain = actx.createGain(); thrustGain.gain.value = 0;
            src.connect(lp); lp.connect(thrustGain); thrustGain.connect(actx.destination);
            src.start();
            return actx;
        }
        function thrustSound(on) {
            var a = audio(); if (!a || !thrustGain) return;
            thrustGain.gain.setTargetAtTime(muted || !on ? 0 : 0.075, a.currentTime, 0.05);
        }
        function blip(f0, f1, dur, type, vol) {
            if (muted) return;
            var a = audio(); if (!a) return;
            var o = a.createOscillator(), g = a.createGain();
            o.type = type || 'square';
            o.frequency.setValueAtTime(f0, a.currentTime);
            o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), a.currentTime + dur);
            g.gain.setValueAtTime(vol || 0.07, a.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
            o.connect(g); g.connect(a.destination);
            o.start(); o.stop(a.currentTime + dur);
        }
        function boom() {
            if (muted) return;
            var a = audio(); if (!a) return;
            var n = Math.floor(a.sampleRate * 0.6), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
            for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
            var src = a.createBufferSource(); src.buffer = buf;
            var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
            var g = a.createGain(); g.gain.value = 0.5;
            src.connect(lp); lp.connect(g); g.connect(a.destination);
            src.start();
        }
        function updateMuteUI() {
            soundOn.style.display = muted ? 'none' : 'block';
            soundOff.style.display = muted ? 'block' : 'none';
            muteBtn.classList.toggle('active', !muted);
        }
        updateMuteUI();
        muteBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            muted = !muted;
            updateMuteUI();
            if (muted) { bgMusic.pause(); thrustSound(false); }
            else if (state === 'running') bgMusic.play().catch(function () {});
        });
        function startMusic() {
            if (muted) return;
            if (!musicStarted) { bgMusic.currentTime = 0; musicStarted = true; }
            bgMusic.play().catch(function () {});
        }

        /* ── World ──────────────────────────────────────────────────── */
        var state = 'idle';
        var score = 0, best = parseInt(localStorage.getItem('orbitHi'), 10) || 0;
        var elapsed = 0, shake = 0, thrusting = false, sinceStart = 0, deadFor = 0, scoreBonus = 0;
        var ship = { x: 0, y: 0, vy: 0, len: 0 };
        var rocks = [], cores = [], bits = [], back = [], front = [];
        var spawnIn = 0, coreIn = 0;

        var GRAV = 1.28, THRUST = 2.82, VMAX = 0.78;     // in screen heights per second: heavy, but it answers
        function speed() { return W * Math.min(0.46, 0.30 + score * 0.0011); }
        function shipLen() { return clamp(H * 0.085, 26, 54); }
        function shipR() { return shipLen() * 0.30; }

        function buildTerrain() {
            var step = Math.max(28, W * 0.07), n = Math.ceil(W / step) + 4, i;
            function layer(baseFrac, ampFrac) {
                var pts = [];
                for (i = 0; i < n; i++) pts.push({ x: i * step, y: H * baseFrac - Math.random() * H * ampFrac });
                return { pts: pts, step: step };
            }
            back = layer(0.965, 0.10);
            front = layer(0.995, 0.085);
        }
        function scrollTerrain(layer, dx, baseFrac, ampFrac) {
            var pts = layer.pts, i;
            for (i = 0; i < pts.length; i++) pts[i].x -= dx;
            while (pts.length && pts[0].x < -layer.step * 2) {
                pts.shift();
                pts.push({ x: pts[pts.length - 1].x + layer.step, y: H * baseFrac - Math.random() * H * ampFrac });
            }
        }
        function heightAt(layer, x) {                    // the top of the ground under a point
            var pts = layer.pts, i;
            for (i = 0; i < pts.length - 1; i++) {
                if (x >= pts[i].x && x <= pts[i + 1].x) {
                    var t = (x - pts[i].x) / (pts[i + 1].x - pts[i].x);
                    return pts[i].y + (pts[i + 1].y - pts[i].y) * t;
                }
            }
            return pts.length ? pts[pts.length - 1].y : H;
        }

        function makeRock(x, y, r) {
            var n = Math.floor(rand(9, 13)), verts = [], craters = [], i;
            for (i = 0; i < n; i++) verts.push(rand(0.74, 1.06));
            for (i = 0; i < 3; i++) craters.push({ a: rand(0, Math.PI * 2), d: rand(0.15, 0.6), s: rand(0.1, 0.26) });
            return { x: x, y: y, r: r, verts: verts, craters: craters, rot: rand(0, Math.PI * 2), spin: rand(-0.6, 0.6), vy: rand(-0.05, 0.05) * H, k: rand(0.9, 1.35) };
        }
        function spawnRocks() {
            var top = H * 0.06, bot = heightAt(front, W) - H * 0.06;
            var big = Math.random() < 0.3;
            var r = big ? rand(H * 0.075, H * 0.115) : rand(H * 0.032, H * 0.07);
            var y = rand(top + r, bot - r);
            rocks.push(makeRock(W + r + 10, y, r));
            if (!big && Math.random() < 0.22) {           // a second one, with a gap you can fly through
                var gap = H * rand(0.26, 0.36);
                var y2 = y + (Math.random() < 0.5 ? -1 : 1) * gap;
                if (y2 > top + r && y2 < bot - r) rocks.push(makeRock(W + r + rand(20, 120), y2, rand(H * 0.032, H * 0.06)));
            }
            spawnIn = clamp(1.08 - score * 0.0022, 0.44, 1.08) * rand(0.78, 1.3);
        }
        function spawnCore() {
            var top = H * 0.12, bot = heightAt(front, W) - H * 0.12;
            cores.push({ x: W + 20, y: rand(top, bot), r: Math.max(7, H * 0.016), ph: rand(0, 6.28) });
            coreIn = rand(3.2, 6.4);
        }
        function burst(x, y, n, warm, spread) {
            for (var i = 0; i < n; i++) {
                var a = rand(0, Math.PI * 2), v = rand(0.06, spread) * H;
                bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 1.1), age: 0, r: rand(1.2, 3.6), warm: warm });
            }
        }

        function reset() {
            score = 0; scoreBonus = 0; elapsed = 0; sinceStart = 0; deadFor = 0; shake = 0;
            rocks = []; cores = []; bits = [];
            ship.x = W * 0.24; ship.y = H * 0.42; ship.vy = 0;
            spawnIn = 1.1; coreIn = 2.4;
            buildTerrain();
        }
        function start() {
            reset();
            state = 'running';
            bar.textContent = 'hold to climb · let go to fall';
            startMusic();
        }
        function crash() {
            state = 'over';
            deadFor = 0;
            thrusting = false; thrustSound(false);
            burst(ship.x, ship.y, 34, true, 0.5);
            burst(ship.x, ship.y, 16, false, 0.34);
            shake = 1;
            boom();
            bgMusic.pause();
            if (score > best) { best = score; try { localStorage.setItem('orbitHi', String(best)); } catch (e) {} }
            bar.textContent = 'crashed · ' + GO;
        }

        /* ── Input ──────────────────────────────────────────────────── */
        function press() {
            if (state === 'idle') { start(); thrusting = true; thrustSound(true); return; }
            if (state === 'over') { if (deadFor > 0.5) { start(); thrusting = true; thrustSound(true); } return; }
            thrusting = true; thrustSound(true);
        }
        function release() { thrusting = false; thrustSound(false); }
        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
        });
        document.addEventListener('keyup', function (e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); release(); }
        });
        wrap.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });
        window.addEventListener('pointerup', release);
        window.addEventListener('pointercancel', release);
        wrap.addEventListener('touchstart', function (e) { e.preventDefault(); press(); }, { passive: false });
        wrap.addEventListener('touchend', function (e) { e.preventDefault(); release(); }, { passive: false });
        window.addEventListener('blur', release);

        /* ── Step ───────────────────────────────────────────────────── */
        function update(dt) {
            sinceStart += dt;
            var i;
            if (state === 'idle') {
                ship.x = W * 0.24;
                ship.y = H * 0.42 + Math.sin(sinceStart * 1.6) * H * 0.02;
                scrollTerrain(front, W * 0.06 * dt, 0.995, 0.085);
                scrollTerrain(back, W * 0.03 * dt, 0.965, 0.10);
                return;
            }
            if (state === 'over') {
                deadFor += dt;
                shake = Math.max(0, shake - dt * 2.2);
                for (i = bits.length - 1; i >= 0; i--) {
                    var q = bits[i]; q.age += dt;
                    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += H * 0.7 * dt;
                    if (q.age > q.life) bits.splice(i, 1);
                }
                return;
            }

            elapsed += dt;
            score = Math.floor(elapsed * 10) + scoreBonus;
            var dx = speed() * dt;

            ship.vy += GRAV * H * dt;
            if (thrusting) ship.vy -= THRUST * H * dt;
            ship.vy = clamp(ship.vy, -VMAX * H, VMAX * H);
            ship.y += ship.vy * dt;
            ship.len = shipLen();

            var r = shipR();
            if (ship.y < r) { ship.y = r; ship.vy = Math.max(ship.vy, 0); }   // the top of the frame is a wall
            if (ship.y > heightAt(front, ship.x) - r * 0.55) { crash(); return; }

            if (thrusting && Math.random() < 0.9) {                            // sparks off the plume
                bits.push({ x: ship.x - ship.len * 0.5, y: ship.y + rand(-2, 2), vx: -rand(0.05, 0.16) * W, vy: rand(-0.03, 0.03) * H, life: rand(0.16, 0.4), age: 0, r: rand(1, 2.6), warm: true });
            }

            scrollTerrain(front, dx, 0.995, 0.085);
            scrollTerrain(back, dx * 0.45, 0.965, 0.10);

            spawnIn -= dt; if (spawnIn <= 0) spawnRocks();
            coreIn -= dt; if (coreIn <= 0) spawnCore();

            for (i = rocks.length - 1; i >= 0; i--) {
                var k = rocks[i];
                k.x -= dx * k.k; k.y += k.vy * dt; k.rot += k.spin * dt;
                if (k.x + k.r < -20) { rocks.splice(i, 1); continue; }
                var ddx = k.x - ship.x, ddy = k.y - ship.y;
                if (ddx * ddx + ddy * ddy < Math.pow(k.r * 0.84 + r * 0.8, 2)) { crash(); return; }
            }
            for (i = cores.length - 1; i >= 0; i--) {
                var c = cores[i];
                c.x -= dx; c.ph += dt * 3;
                if (c.x + c.r < -20) { cores.splice(i, 1); continue; }
                var cdx = c.x - ship.x, cdy = c.y - ship.y;
                if (cdx * cdx + cdy * cdy < Math.pow(c.r + r, 2)) {
                    cores.splice(i, 1); scoreBonus += 5;
                    burst(c.x, c.y, 12, true, 0.22);
                    blip(760, 1240, 0.16, 'triangle', 0.05);
                }
            }
            for (i = bits.length - 1; i >= 0; i--) {
                var b2 = bits[i]; b2.age += dt;
                b2.x += b2.vx * dt - dx * 0.4; b2.y += b2.vy * dt;
                if (b2.age > b2.life) bits.splice(i, 1);
            }
            shake = Math.max(0, shake - dt * 2.2);
        }

        /* ── Draw ───────────────────────────────────────────────────── */
        function drawTerrain(layer, fill, rim) {
            var pts = layer.pts; if (!pts.length) return;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, H + 4);
            for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[pts.length - 1].x, H + 4);
            ctx.closePath();
            var g = ctx.createLinearGradient(0, H * 0.86, 0, H);
            g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]);
            ctx.fillStyle = g; ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.strokeStyle = rim; ctx.lineWidth = 1.6; ctx.stroke();
        }
        function drawRock(k) {
            ctx.save();
            ctx.translate(k.x, k.y); ctx.rotate(k.rot);
            var n = k.verts.length, i;
            ctx.beginPath();
            for (i = 0; i < n; i++) {
                var a = (i / n) * Math.PI * 2, rr = k.r * k.verts[i];
                var x = Math.cos(a) * rr, y = Math.sin(a) * rr;
                if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
            }
            ctx.closePath();
            var g = ctx.createLinearGradient(-k.r * 0.7, -k.r * 0.7, k.r * 0.6, k.r * 0.8);
            g.addColorStop(0, '#7a5f4e'); g.addColorStop(0.42, '#33251d'); g.addColorStop(1, '#110c0a');
            ctx.fillStyle = g; ctx.fill();
            ctx.strokeStyle = 'rgba(255, 174, 106, 0.42)'; ctx.lineWidth = 1.2; ctx.stroke();
            for (i = 0; i < k.craters.length; i++) {
                var c = k.craters[i], cx = Math.cos(c.a) * k.r * c.d, cy = Math.sin(c.a) * k.r * c.d;
                ctx.beginPath(); ctx.arc(cx, cy, k.r * c.s, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0,0,0,0.34)'; ctx.fill();
                ctx.beginPath(); ctx.arc(cx, cy, k.r * c.s, Math.PI * 1.1, Math.PI * 1.9);
                ctx.strokeStyle = 'rgba(255,214,180,0.13)'; ctx.lineWidth = 1; ctx.stroke();
            }
            ctx.restore();
        }
        function drawCore(c) {
            var pulse = 1 + Math.sin(c.ph) * 0.14;
            var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 3.4 * pulse);
            g.addColorStop(0, 'rgba(255, 224, 190, 0.95)');
            g.addColorStop(0.3, 'rgba(255, 174, 106, 0.45)');
            g.addColorStop(1, 'rgba(255, 174, 106, 0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 3.4 * pulse, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFF1E2';
            ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.62 * pulse, 0, Math.PI * 2); ctx.fill();
        }
        function drawShip(alive) {
            var L = shipLen(), w = L * 0.42;
            var tilt = clamp(ship.vy / (VMAX * H), -1, 1) * 0.42;
            ctx.save();
            ctx.translate(ship.x, ship.y);
            ctx.rotate(tilt);
            if (thrusting && alive) {                                   // the plume
                var f = L * (0.45 + Math.random() * 0.5);
                var pg = ctx.createLinearGradient(-L * 0.46, 0, -L * 0.46 - f, 0);
                pg.addColorStop(0, 'rgba(255, 240, 220, 0.95)');
                pg.addColorStop(0.35, 'rgba(255, 174, 106, 0.75)');
                pg.addColorStop(1, 'rgba(184, 83, 46, 0)');
                ctx.beginPath();
                ctx.moveTo(-L * 0.44, -w * 0.3);
                ctx.quadraticCurveTo(-L * 0.46 - f * 0.6, -w * 0.1, -L * 0.46 - f, 0);
                ctx.quadraticCurveTo(-L * 0.46 - f * 0.6, w * 0.1, -L * 0.44, w * 0.3);
                ctx.closePath();
                ctx.fillStyle = pg; ctx.fill();
            }
            ctx.beginPath();                                            // fins
            ctx.moveTo(-L * 0.16, -w * 0.4); ctx.lineTo(-L * 0.5, -w * 0.98); ctx.lineTo(-L * 0.42, -w * 0.3);
            ctx.closePath();
            ctx.moveTo(-L * 0.16, w * 0.4); ctx.lineTo(-L * 0.5, w * 0.98); ctx.lineTo(-L * 0.42, w * 0.3);
            ctx.closePath();
            ctx.fillStyle = '#B8532E'; ctx.fill();
            ctx.beginPath();                                            // hull
            ctx.moveTo(L * 0.5, 0);
            ctx.quadraticCurveTo(L * 0.16, -w * 0.5, -L * 0.24, -w * 0.46);
            ctx.lineTo(-L * 0.44, -w * 0.32);
            ctx.quadraticCurveTo(-L * 0.5, 0, -L * 0.44, w * 0.32);
            ctx.lineTo(-L * 0.24, w * 0.46);
            ctx.quadraticCurveTo(L * 0.16, w * 0.5, L * 0.5, 0);
            ctx.closePath();
            var hg = ctx.createLinearGradient(0, -w * 0.5, 0, w * 0.5);
            hg.addColorStop(0, '#FBF3EA'); hg.addColorStop(0.55, '#D9C3B0'); hg.addColorStop(1, '#8A6552');
            ctx.fillStyle = hg; ctx.fill();
            ctx.strokeStyle = 'rgba(45, 26, 14, 0.55)'; ctx.lineWidth = 1; ctx.stroke();
            ctx.beginPath();                                            // window
            ctx.arc(L * 0.12, -w * 0.03, w * 0.2, 0, Math.PI * 2);
            ctx.fillStyle = '#20303F'; ctx.fill();
            ctx.strokeStyle = '#FFAE6A'; ctx.lineWidth = 1.4; ctx.stroke();
            ctx.beginPath();
            ctx.arc(L * 0.09, -w * 0.09, w * 0.08, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 241, 226, 0.6)'; ctx.fill();
            ctx.restore();
        }
        function render() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (shake > 0) ctx.translate(rand(-1, 1) * shake * 9, rand(-1, 1) * shake * 9);

            var haze = ctx.createLinearGradient(0, H * 0.72, 0, H * 0.93);
            haze.addColorStop(0, 'rgba(255, 174, 106, 0)'); haze.addColorStop(1, 'rgba(184, 83, 46, 0.13)');
            ctx.fillStyle = haze; ctx.fillRect(0, H * 0.72, W, H * 0.21);
            drawTerrain(back, ['rgba(60, 42, 31, 0.9)', 'rgba(12, 8, 6, 0.96)'], 'rgba(184, 83, 46, 0.38)');
            drawTerrain(front, ['#3B2A1F', '#090605'], 'rgba(255, 174, 106, 0.66)');

            var i;
            for (i = 0; i < cores.length; i++) drawCore(cores[i]);
            for (i = 0; i < rocks.length; i++) drawRock(rocks[i]);
            for (i = 0; i < bits.length; i++) {
                var b2 = bits[i], k = 1 - b2.age / b2.life;
                ctx.globalAlpha = Math.max(0, k);
                ctx.fillStyle = b2.warm ? '#FFC088' : '#8A6552';
                ctx.beginPath(); ctx.arc(b2.x, b2.y, b2.r * (0.4 + k * 0.6), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (state !== 'over') drawShip(state === 'running');

            ctx.restore();

            if (state === 'idle' || state === 'over') {
                var ink = css('--text', '#F2EAE0'), dim = css('--text-3', '#896653');
                ctx.textAlign = 'center';
                ctx.fillStyle = ink;
                ctx.font = '600 ' + Math.round(clamp(H * 0.052, 20, 34)) + 'px "Space Grotesk", sans-serif';
                var ty = H * 0.19;
                ctx.fillText(state === 'idle' ? 'Orbit' : 'Lost to the rocks', W / 2, ty);
                ctx.fillStyle = dim;
                ctx.font = '500 ' + Math.round(clamp(H * 0.024, 11, 14)) + 'px "JetBrains Mono", monospace';
                ctx.fillText(state === 'idle' ? (TOUCH ? 'HOLD TO FLY · AVOID THE ROCKS' : 'HOLD SPACE TO FLY · AVOID THE ROCKS')
                                              : 'SCORE ' + score + '   ·   ' + GO.toUpperCase(), W / 2, ty + clamp(H * 0.045, 22, 32));
            }
            scoreEl.textContent = (state === 'idle' && !best) ? '' : 'score ' + score + ' · best ' + best;
        }

        /* ── Loop ───────────────────────────────────────────────────── */
        var last = 0;
        function loop(now) {
            var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
            last = now;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }
        resize();
        reset();
        state = 'idle';
        bar.textContent = TOUCH ? 'hold to fly · avoid the rocks' : 'hold space to fly · avoid the rocks';
        requestAnimationFrame(loop);

        window.__game = {                                  // for the tests: what the rocket is doing
            state: function () { return state; },
            y: function () { return ship.y; },
            vy: function () { return ship.vy; },
            score: function () { return score; },
            best: function () { return best; },
            height: function () { return H; }
        };
    })();
    </script>

</body>
</html>
