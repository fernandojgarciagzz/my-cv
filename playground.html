<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Playground — Fernando García</title>
    <meta name="robots" content="noindex">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Covered+By+Your+Grace&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" defer></script>
    <script src="assets/js/galaxy.js?v=6" defer></script>
    <style>
        body {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:        #FAF6F1;
            --bg-2:      #F2EBE2;
            --bg-card:   #EFE7DC;
            --rust:      #D97757;
            --rust-dark: #C4633F;
            --rust-light:#F0A882;
            --rust-dim:  rgba(217,119,87,0.15);
            --rust-alpha:rgba(217,119,87,0.12);
            --text:      #2D1A0E;
            --text-2:    #7A5C48;
            --text-3:    #A8866E;
            --border:    rgba(217,119,87,0.2);
            --nav-bg:    rgba(250,246,241,0.88);
            --mono: 'JetBrains Mono', monospace;
            --heading: 'Space Grotesk', sans-serif;
            --body: 'Inter', sans-serif;
            --hand: 'Covered By Your Grace', cursive;
        }

        .dark {
            --bg:        #160C06;
            --bg-2:      #1F1108;
            --bg-card:   #2A1A0D;
            --rust:      #D97757;
            --rust-dark: #E8916E;
            --rust-light:#F0A882;
            --rust-dim:  rgba(217,119,87,0.12);
            --rust-alpha:rgba(217,119,87,0.12);
            --text:      #F2EAE0;
            --text-2:    #C4A48A;
            --text-3:    #896653;
            --border:    rgba(217,119,87,0.18);
            --nav-bg:    rgba(22,12,6,0.92);
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--text);
            -webkit-font-smoothing: antialiased;
            transition: background 0.5s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        nav {
            position: relative;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border);
            transition: background 0.4s ease, border-color 0.4s ease;
            flex-shrink: 0;
        }
        .nav-inner {
            max-width: 100%;
            margin: 0 auto;
            padding: 0 1.2rem;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-back {
            font-family: var(--mono);
            font-size: 0.72rem;
            color: var(--text-2);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: color 0.2s ease;
            letter-spacing: 0.02em;
        }
        .nav-back:hover { color: var(--rust); }
        .nav-back svg { width: 14px; height: 14px; }
        .nav-title {
            font-family: var(--hand);
            font-size: 1.6rem;
            color: var(--rust);
            letter-spacing: 0.01em;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
        .nav-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .nav-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--bg-2);
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.85rem;
            color: var(--text-3);
            transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
        }
        .nav-btn:hover { border-color: var(--rust); color: var(--rust); }
        .nav-btn.active { background: var(--rust-dim); border-color: var(--rust); color: var(--rust); }

        /* Sound wave icon (SVG inside button) */
        .nav-btn svg {
            width: 16px; height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
        }

        /* ── The black hole from the home page, dimmed, behind the whole game ── */
        #space { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: 0; transition: opacity 1.4s ease; }
        html.space-live #space { opacity: 0.44; }
        html.no-webgl #space { display: none; }

        /* ── Game canvas — fills remaining space, transparent so the hole shows through ── */
        .game-area {
            flex: 1;
            position: relative;
            z-index: 1;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden;
        }
        .game-area canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        /* ── Geometric Swahili pattern (from Roho) ── */
        .geo-corner {
            position: absolute;
            opacity: 0.12;
            pointer-events: none;
            z-index: 1;
        }
        .geo-corner.top-left { top: 8px; left: 8px; }
        .geo-corner.bottom-right { bottom: 8px; right: 8px; transform: rotate(180deg); }
        .geo-corner .geo-diamond {
            width: 8px; height: 8px;
            background: var(--rust);
            transform: rotate(45deg);
            display: inline-block;
            margin: 2px;
        }
        .geo-corner .geo-diamond.sm { width: 5px; height: 5px; }

        /* ── Score bar at bottom ── */
        .score-bar {
            position: relative;
            z-index: 10;
            flex-shrink: 0;
            padding: 0.4rem 1.2rem;
            background: var(--bg-2);
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-family: var(--mono);
            font-size: 0.6rem;
            letter-spacing: 0.06em;
            color: var(--text-3);
            text-transform: uppercase;
            transition: background 0.4s ease, border-color 0.4s ease;
            gap: 1rem;
        }
        .score-bar span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        #gameScore { flex-shrink: 0; }
    </style>
</head>
<body>

    <canvas id="space" data-ambient data-count="26000" aria-hidden="true"></canvas>

    <nav>
        <div class="nav-inner">
            <a href="index.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
                portfolio
            </a>
            <span class="nav-title">Playground</span>
            <div class="nav-controls">
                <button class="nav-btn" id="muteBtn" aria-label="Toggle sound">
                    <svg id="soundOn" viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.08"/></svg>
                    <svg id="soundOff" viewBox="0 0 24 24" style="display:none"><path d="M11 5L6 9H2v6h4l5 4V5z"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
                </button>
                <button class="nav-btn" id="darkToggle" aria-label="Toggle dark mode">&#x1F319;</button>
            </div>
        </div>
    </nav>

    <div class="game-area" id="gameArea">
        <div class="geo-corner top-left">
            <span class="geo-diamond sm"></span>
            <span class="geo-diamond"></span>
            <span class="geo-diamond sm"></span>
        </div>
        <div class="geo-corner bottom-right">
            <span class="geo-diamond sm"></span>
            <span class="geo-diamond"></span>
            <span class="geo-diamond sm"></span>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="score-bar">
        <span id="gameScoreBar">hold space to fly · avoid the rocks</span>
        <span id="gameScore"></span>
    </div>

    <!-- Dark mode toggle -->
    <script>
    (function(){
        const btn = document.getElementById('darkToggle');
        const root = document.documentElement;
        // Dark is always the default; the toggle only changes this visit. The black hole reads these
        // classes off <html>, so it turns with the page: warm on black, ink and rust on white.
        function apply(dark) {
            document.body.classList.toggle('dark', dark);
            root.classList.toggle('dark', dark);
            root.classList.toggle('light', !dark);
            root.classList.add('claude-mode');
            btn.innerHTML = dark ? '&#x2600;' : '&#x1F319;';
        }
        apply(true);
        btn.addEventListener('click', () => apply(!document.body.classList.contains('dark')));
    })();
    </script>

    <!-- Anti-copy protection -->
    <script>
    (function(){
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 'u') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); return; }
            if ((e.ctrlKey || e.metaKey) && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')) { e.preventDefault(); return; }
        });
        if (window.top !== window.self) { window.top.location = window.self.location; }
    })();
    </script>

    <!-- Orbit — fly the rocket past the rocks; the black hole watches -->
    <script>
    (function () {
        'use strict';
        var wrap = document.getElementById('gameArea');
        var canvas = document.getElementById('gameCanvas');
        var ctx = canvas.getContext('2d');
        var bar = document.getElementById('gameScoreBar');
        var scoreEl = document.getElementById('gameScore');
        var muteBtn = document.getElementById('muteBtn');
        var soundOn = document.getElementById('soundOn');
        var soundOff = document.getElementById('soundOff');

        /* ── Canvas ─────────────────────────────────────────────────── */
        var DPR = 1, W = 0, H = 0;
        function resize() {
            var r = wrap.getBoundingClientRect();
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            W = r.width; H = r.height;
            canvas.width = Math.max(1, Math.round(W * DPR));
            canvas.height = Math.max(1, Math.round(H * DPR));
            ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            buildTerrain();
        }
        window.addEventListener('resize', resize);

        function css(name, fallback) {
            var v = getComputedStyle(document.body).getPropertyValue(name).trim();
            return v || fallback;
        }
        var TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        var GO = TOUCH ? 'tap to fly again' : 'press space to fly again';
        function rand(a, b) { return a + Math.random() * (b - a); }
        function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }

        /* ── Sound: a thrust that breathes, a chime, a crash ─────────── */
        var muted = false, actx = null, thrustGain = null;
        var ALBUM = ['Nashukuru.mp3', 'Kuwa Hapa Sa.mp3', 'Kuwa Hapa Sa V2.mp3', 'Tiririka.mp3'];
        var trackIdx = 0, musicStarted = false;
        var bgMusic = new Audio(ALBUM[0]);
        bgMusic.volume = 0.42;
        bgMusic.addEventListener('ended', function () {
            trackIdx = (trackIdx + 1) % ALBUM.length;
            bgMusic.src = ALBUM[trackIdx];
            if (!muted && state === 'running') bgMusic.play().catch(function () {});
        });
        function audio() {
            if (actx) return actx;
            try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
            var n = actx.sampleRate * 2, buf = actx.createBuffer(1, n, actx.sampleRate), d = buf.getChannelData(0);
            for (var i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
            var src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
            var lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 380;
            thrustGain = actx.createGain(); thrustGain.gain.value = 0;
            src.connect(lp); lp.connect(thrustGain); thrustGain.connect(actx.destination);
            src.start();
            return actx;
        }
        function thrustSound(on) {
            var a = audio(); if (!a || !thrustGain) return;
            thrustGain.gain.setTargetAtTime(muted || !on ? 0 : 0.075, a.currentTime, 0.05);
        }
        function blip(f0, f1, dur, type, vol) {
            if (muted) return;
            var a = audio(); if (!a) return;
            var o = a.createOscillator(), g = a.createGain();
            o.type = type || 'square';
            o.frequency.setValueAtTime(f0, a.currentTime);
            o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), a.currentTime + dur);
            g.gain.setValueAtTime(vol || 0.07, a.currentTime);
            g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
            o.connect(g); g.connect(a.destination);
            o.start(); o.stop(a.currentTime + dur);
        }
        function boom() {
            if (muted) return;
            var a = audio(); if (!a) return;
            var n = Math.floor(a.sampleRate * 0.6), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
            for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2.2);
            var src = a.createBufferSource(); src.buffer = buf;
            var lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
            var g = a.createGain(); g.gain.value = 0.5;
            src.connect(lp); lp.connect(g); g.connect(a.destination);
            src.start();
        }
        function updateMuteUI() {
            soundOn.style.display = muted ? 'none' : 'block';
            soundOff.style.display = muted ? 'block' : 'none';
            muteBtn.classList.toggle('active', !muted);
        }
        updateMuteUI();
        muteBtn.addEventListener('click', function (e) {
            e.stopPropagation();
            muted = !muted;
            updateMuteUI();
            if (muted) { bgMusic.pause(); thrustSound(false); }
            else if (state === 'running') bgMusic.play().catch(function () {});
        });
        function startMusic() {
            if (muted) return;
            if (!musicStarted) { bgMusic.currentTime = 0; musicStarted = true; }
            bgMusic.play().catch(function () {});
        }

        /* ── World ──────────────────────────────────────────────────── */
        var state = 'idle';
        var score = 0, best = parseInt(localStorage.getItem('orbitHi'), 10) || 0;
        var elapsed = 0, shake = 0, thrusting = false, sinceStart = 0, deadFor = 0, scoreBonus = 0, clock = 0;
        var ship = { x: 0, y: 0, vy: 0, len: 0 };
        var rocks = [], cores = [], bits = [], back = [], front = [];
        var spawnIn = 0, coreIn = 0;

        var GRAV = 1.28, THRUST = 2.82, VMAX = 0.78;     // in screen heights per second: heavy, but it answers
        function speed() { return W * Math.min(0.46, 0.30 + score * 0.0011); }
        function shipLen() { return clamp(H * 0.105, 34, 76); }
        function shipR() { return shipLen() * 0.30; }

        function buildTerrain() {
            var step = Math.max(28, W * 0.07), n = Math.ceil(W / step) + 4, i;
            function layer(baseFrac, ampFrac) {
                var pts = [];
                for (i = 0; i < n; i++) pts.push({ x: i * step, y: H * baseFrac - Math.random() * H * ampFrac });
                return { pts: pts, step: step };
            }
            back = layer(0.965, 0.10);
            front = layer(0.995, 0.085);
        }
        function scrollTerrain(layer, dx, baseFrac, ampFrac) {
            var pts = layer.pts, i;
            for (i = 0; i < pts.length; i++) pts[i].x -= dx;
            while (pts.length && pts[0].x < -layer.step * 2) {
                pts.shift();
                pts.push({ x: pts[pts.length - 1].x + layer.step, y: H * baseFrac - Math.random() * H * ampFrac });
            }
        }
        function heightAt(layer, x) {                    // the top of the ground under a point
            var pts = layer.pts, i;
            for (i = 0; i < pts.length - 1; i++) {
                if (x >= pts[i].x && x <= pts[i + 1].x) {
                    var t = (x - pts[i].x) / (pts[i + 1].x - pts[i].x);
                    return pts[i].y + (pts[i + 1].y - pts[i].y) * t;
                }
            }
            return pts.length ? pts[pts.length - 1].y : H;
        }

        var ROCK_TONES = [                                  // dark rock, warm only where the hole reaches it
            ['#6B5545', '#33261E', '#080605'],
            ['#775A40', '#3A2819', '#080504'],
            ['#5D4E44', '#2C221C', '#070504'],
            ['#7A5838', '#3B2717', '#090604']
        ];
        function makeRock(x, y, r) {
            var n = Math.floor(rand(10, 15)), verts = [], craters = [], dots = [], i;
            for (i = 0; i < n; i++) verts.push({ r: rand(0.70, 1.10), a: rand(-0.5, 0.5) });
            var nc = r > H * 0.06 ? 5 : 3;
            for (i = 0; i < nc; i++) craters.push({ a: rand(0, Math.PI * 2), d: rand(0.12, 0.62), s: rand(0.09, 0.24), e: rand(0.6, 1) });
            for (i = 0; i < 14; i++) dots.push({ a: rand(0, Math.PI * 2), d: rand(0.1, 0.86), s: rand(0.012, 0.038) });
            return {
                x: x, y: y, r: r, verts: verts, craters: craters, dots: dots,
                rot: rand(0, Math.PI * 2), spin: rand(-0.55, 0.55), vy: rand(-0.05, 0.05) * H,
                k: rand(0.9, 1.35), ar: rand(0.68, 1.0), tone: ROCK_TONES[Math.floor(Math.random() * ROCK_TONES.length)]
            };
        }
        function spawnRocks() {
            var top = H * 0.06, bot = heightAt(front, W) - H * 0.06;
            var big = Math.random() < 0.3;
            var r = big ? rand(H * 0.075, H * 0.115) : rand(H * 0.032, H * 0.07);
            var y = rand(top + r, bot - r);
            rocks.push(makeRock(W + r + 10, y, r));
            if (!big && Math.random() < 0.22) {           // a second one, with a gap you can fly through
                var gap = H * rand(0.26, 0.36);
                var y2 = y + (Math.random() < 0.5 ? -1 : 1) * gap;
                if (y2 > top + r && y2 < bot - r) rocks.push(makeRock(W + r + rand(20, 120), y2, rand(H * 0.032, H * 0.06)));
            }
            spawnIn = clamp(1.08 - score * 0.0022, 0.44, 1.08) * rand(0.78, 1.3);
        }
        function spawnCore() {
            var top = H * 0.12, bot = heightAt(front, W) - H * 0.12;
            cores.push({ x: W + 20, y: rand(top, bot), r: Math.max(7, H * 0.016), ph: rand(0, 6.28) });
            coreIn = rand(3.2, 6.4);
        }
        function burst(x, y, n, warm, spread) {
            for (var i = 0; i < n; i++) {
                var a = rand(0, Math.PI * 2), v = rand(0.06, spread) * H;
                bits.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(0.35, 1.1), age: 0, r: rand(1.2, 3.6), warm: warm });
            }
        }

        function reset() {
            score = 0; scoreBonus = 0; elapsed = 0; sinceStart = 0; deadFor = 0; shake = 0;
            rocks = []; cores = []; bits = [];
            ship.x = W * 0.24; ship.y = H * 0.42; ship.vy = 0;
            spawnIn = 1.1; coreIn = 2.4;
            buildTerrain();
        }
        function start() {
            reset();
            state = 'running';
            bar.textContent = 'hold to climb · let go to fall';
            startMusic();
        }
        function crash() {
            state = 'over';
            deadFor = 0;
            thrusting = false; thrustSound(false);
            burst(ship.x, ship.y, 34, true, 0.5);
            burst(ship.x, ship.y, 16, false, 0.34);
            shake = 1;
            boom();
            bgMusic.pause();
            if (score > best) { best = score; try { localStorage.setItem('orbitHi', String(best)); } catch (e) {} }
            bar.textContent = 'crashed · ' + GO;
        }

        /* ── Input ──────────────────────────────────────────────────── */
        function press() {
            if (state === 'idle') { start(); thrusting = true; thrustSound(true); return; }
            if (state === 'over') { if (deadFor > 0.5) { start(); thrusting = true; thrustSound(true); } return; }
            thrusting = true; thrustSound(true);
        }
        function release() { thrusting = false; thrustSound(false); }
        document.addEventListener('keydown', function (e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); if (!e.repeat) press(); }
        });
        document.addEventListener('keyup', function (e) {
            if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW' || e.code === 'Enter') { e.preventDefault(); release(); }
        });
        wrap.addEventListener('pointerdown', function (e) { e.preventDefault(); press(); });
        window.addEventListener('pointerup', release);
        window.addEventListener('pointercancel', release);
        wrap.addEventListener('touchstart', function (e) { e.preventDefault(); press(); }, { passive: false });
        wrap.addEventListener('touchend', function (e) { e.preventDefault(); release(); }, { passive: false });
        window.addEventListener('blur', release);

        /* ── Step ───────────────────────────────────────────────────── */
        function update(dt) {
            clock += dt;
            sinceStart += dt;
            var i;
            if (state === 'idle') {
                ship.x = W * 0.24;
                ship.y = H * 0.42 + Math.sin(sinceStart * 1.6) * H * 0.02;
                scrollTerrain(front, W * 0.06 * dt, 0.995, 0.085);
                scrollTerrain(back, W * 0.03 * dt, 0.965, 0.10);
                return;
            }
            if (state === 'over') {
                deadFor += dt;
                shake = Math.max(0, shake - dt * 2.2);
                for (i = bits.length - 1; i >= 0; i--) {
                    var q = bits[i]; q.age += dt;
                    q.x += q.vx * dt; q.y += q.vy * dt; q.vy += H * 0.7 * dt;
                    if (q.age > q.life) bits.splice(i, 1);
                }
                return;
            }

            elapsed += dt;
            score = Math.floor(elapsed * 10) + scoreBonus;
            var dx = speed() * dt;

            ship.vy += GRAV * H * dt;
            if (thrusting) ship.vy -= THRUST * H * dt;
            ship.vy = clamp(ship.vy, -VMAX * H, VMAX * H);
            ship.y += ship.vy * dt;
            ship.len = shipLen();

            var r = shipR();
            if (ship.y < r) { ship.y = r; ship.vy = Math.max(ship.vy, 0); }   // the top of the frame is a wall
            if (ship.y > heightAt(front, ship.x) - r * 0.55) { crash(); return; }

            if (thrusting && Math.random() < 0.9) {                            // sparks off the plume
                bits.push({ x: ship.x - ship.len * 0.5, y: ship.y + rand(-2, 2), vx: -rand(0.05, 0.16) * W, vy: rand(-0.03, 0.03) * H, life: rand(0.16, 0.4), age: 0, r: rand(1, 2.6), warm: true });
            }

            scrollTerrain(front, dx, 0.995, 0.085);
            scrollTerrain(back, dx * 0.45, 0.965, 0.10);

            spawnIn -= dt; if (spawnIn <= 0) spawnRocks();
            coreIn -= dt; if (coreIn <= 0) spawnCore();

            for (i = rocks.length - 1; i >= 0; i--) {
                var k = rocks[i];
                k.x -= dx * k.k; k.y += k.vy * dt; k.rot += k.spin * dt;
                if (k.x + k.r < -20) { rocks.splice(i, 1); continue; }
                var ddx = k.x - ship.x, ddy = k.y - ship.y;
                if (ddx * ddx + ddy * ddy < Math.pow(k.r * 0.84 + r * 0.8, 2)) { crash(); return; }
            }
            for (i = cores.length - 1; i >= 0; i--) {
                var c = cores[i];
                c.x -= dx; c.ph += dt * 3;
                if (c.x + c.r < -20) { cores.splice(i, 1); continue; }
                var cdx = c.x - ship.x, cdy = c.y - ship.y;
                if (cdx * cdx + cdy * cdy < Math.pow(c.r + r, 2)) {
                    cores.splice(i, 1); scoreBonus += 5;
                    burst(c.x, c.y, 12, true, 0.22);
                    blip(760, 1240, 0.16, 'triangle', 0.05);
                }
            }
            for (i = bits.length - 1; i >= 0; i--) {
                var b2 = bits[i]; b2.age += dt;
                b2.x += b2.vx * dt - dx * 0.4; b2.y += b2.vy * dt;
                if (b2.age > b2.life) bits.splice(i, 1);
            }
            shake = Math.max(0, shake - dt * 2.2);
        }

        /* ── Draw ───────────────────────────────────────────────────── */
        function drawTerrain(layer, fill, rim) {
            var pts = layer.pts; if (!pts.length) return;
            ctx.beginPath();
            ctx.moveTo(pts[0].x, H + 4);
            for (var i = 0; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.lineTo(pts[pts.length - 1].x, H + 4);
            ctx.closePath();
            var g = ctx.createLinearGradient(0, H * 0.86, 0, H);
            g.addColorStop(0, fill[0]); g.addColorStop(1, fill[1]);
            ctx.fillStyle = g; ctx.fill();
            ctx.beginPath();
            ctx.moveTo(pts[0].x, pts[0].y);
            for (i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
            ctx.strokeStyle = rim; ctx.lineWidth = 1.6; ctx.stroke();
        }
        // The light comes off the black hole, up and to the right. The rock tumbles under it: the
        // silhouette is built in the rock's own frame, then filled in screen space so the terminator
        // stays put while the body turns.
        var LX = 0.84, LY = -0.54;
        function drawRock(k) {
            var r = k.r, v = k.verts, n = v.length, i, step = Math.PI * 2 / n;
            function at(j) {                                 // vertex j, in the rock's own frame
                var idx = ((j % n) + n) % n, a = idx * step + v[idx].a * step * 0.55, rr = r * v[idx].r;
                return [Math.cos(a) * rr, Math.sin(a) * rr];
            }
            ctx.save();
            ctx.translate(k.x, k.y);
            ctx.rotate(k.rot);
            ctx.scale(1, k.ar);
            ctx.beginPath();
            var p0 = at(0), p1 = at(1);
            ctx.moveTo((p0[0] + p1[0]) / 2, (p0[1] + p1[1]) / 2);
            for (i = 1; i <= n; i++) {                       // through the vertices, kept rocky
                var c0 = at(i), c1 = at(i + 1);
                ctx.quadraticCurveTo(c0[0], c0[1], (c0[0] + c1[0]) / 2, (c0[1] + c1[1]) / 2);
            }
            ctx.closePath();
            ctx.restore();

            ctx.save();
            ctx.translate(k.x, k.y);                         // the body turned; the light does not
            var g = ctx.createRadialGradient(LX * r * 0.62, LY * r * 0.62, r * 0.04, LX * r * 0.28, LY * r * 0.28, r * 1.42);
            g.addColorStop(0, k.tone[0]); g.addColorStop(0.26, k.tone[1]); g.addColorStop(0.72, k.tone[2]); g.addColorStop(1, '#050403');
            ctx.fillStyle = g; ctx.fill();

            var rim = ctx.createLinearGradient(LX * r, LY * r, -LX * r, -LY * r);
            rim.addColorStop(0, 'rgba(255, 206, 160, 0.8)');
            rim.addColorStop(0.28, 'rgba(255, 174, 106, 0.16)');
            rim.addColorStop(0.62, 'rgba(255, 174, 106, 0)');
            ctx.strokeStyle = rim; ctx.lineWidth = Math.max(1, r * 0.035); ctx.stroke();

            ctx.clip();                                      // everything below stays inside the rock
            ctx.rotate(k.rot);
            var lx = LX * Math.cos(k.rot) + LY * Math.sin(k.rot);      // where the light sits from here
            var ly = -LX * Math.sin(k.rot) + LY * Math.cos(k.rot);
            var la = Math.atan2(ly, lx);
            for (i = 0; i < k.dots.length; i++) {            // grit
                var d = k.dots[i];
                ctx.beginPath();
                ctx.arc(Math.cos(d.a) * r * d.d, Math.sin(d.a) * r * d.d * k.ar, r * d.s, 0, Math.PI * 2);
                ctx.fillStyle = i % 2 ? 'rgba(0,0,0,0.34)' : 'rgba(255, 224, 190, 0.07)';
                ctx.fill();
            }
            for (i = 0; i < k.craters.length; i++) {         // craters: lit far wall, shadowed near wall
                var c = k.craters[i], cx = Math.cos(c.a) * r * c.d, cy = Math.sin(c.a) * r * c.d * k.ar, cr = r * c.s;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.beginPath(); ctx.ellipse(0, 0, cr, cr * c.e, c.a, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 0, 0, 0.36)'; ctx.fill();
                ctx.beginPath();
                ctx.arc(0, 0, cr * 0.86, la + Math.PI * 0.42, la + Math.PI * 1.58);
                ctx.strokeStyle = 'rgba(255, 206, 165, 0.20)'; ctx.lineWidth = Math.max(0.8, cr * 0.26); ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, cr * 1.02, la - Math.PI * 0.5, la + Math.PI * 0.5);
                ctx.strokeStyle = 'rgba(255, 200, 155, 0.10)'; ctx.lineWidth = Math.max(0.7, cr * 0.15); ctx.stroke();
                ctx.restore();
            }
            ctx.restore();
        }

        function drawCore(c) {
            var pulse = 1 + Math.sin(c.ph) * 0.14;
            var g = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r * 3.4 * pulse);
            g.addColorStop(0, 'rgba(255, 224, 190, 0.95)');
            g.addColorStop(0.3, 'rgba(255, 174, 106, 0.45)');
            g.addColorStop(1, 'rgba(255, 174, 106, 0)');
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 3.4 * pulse, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFF1E2';
            ctx.beginPath(); ctx.arc(c.x, c.y, c.r * 0.62 * pulse, 0, Math.PI * 2); ctx.fill();
        }
        // The hull is drawn once into an offscreen canvas and reused: it costs nothing per frame and
        // pays for a lot of detail. The plume, the glow and the nav lights are live on top of it.
        var hullC = null, hullL = 0;
        function buildHull(L) {
            var S = 3, pad = 0.12 * L, w = (1.16 + 0.24) * L, h = (0.92 + 0.24) * L;
            var c = document.createElement('canvas');
            c.width = Math.ceil(w * S); c.height = Math.ceil(h * S);
            var g = c.getContext('2d');
            g.setTransform(S, 0, 0, S, (0.60 * L + pad) * S, (0.46 * L + pad) * S);
            var grad;

            function hullPath() {
                g.beginPath();
                g.moveTo(0.52 * L, 0);
                g.bezierCurveTo(0.34 * L, -0.13 * L, 0.06 * L, -0.185 * L, -0.20 * L, -0.185 * L);
                g.lineTo(-0.40 * L, -0.15 * L);
                g.lineTo(-0.44 * L, -0.115 * L);
                g.lineTo(-0.44 * L, 0.115 * L);
                g.lineTo(-0.40 * L, 0.15 * L);
                g.lineTo(-0.20 * L, 0.185 * L);
                g.bezierCurveTo(0.06 * L, 0.185 * L, 0.34 * L, 0.13 * L, 0.52 * L, 0);
                g.closePath();
            }

            // fins, behind the hull
            g.beginPath();
            g.moveTo(-0.06 * L, -0.15 * L); g.lineTo(-0.47 * L, -0.44 * L); g.lineTo(-0.39 * L, -0.12 * L); g.closePath();
            g.moveTo(-0.06 * L, 0.15 * L); g.lineTo(-0.47 * L, 0.44 * L); g.lineTo(-0.39 * L, 0.12 * L); g.closePath();
            grad = g.createLinearGradient(0, -0.44 * L, 0, 0.44 * L);
            grad.addColorStop(0, '#E08A5E'); grad.addColorStop(0.5, '#A8462A'); grad.addColorStop(1, '#5E2415');
            g.fillStyle = grad; g.fill();
            g.strokeStyle = 'rgba(20, 10, 6, 0.5)'; g.lineWidth = 0.9; g.stroke();

            // engine bell
            g.beginPath();
            g.moveTo(-0.42 * L, -0.115 * L); g.lineTo(-0.57 * L, -0.165 * L);
            g.lineTo(-0.57 * L, 0.165 * L); g.lineTo(-0.42 * L, 0.115 * L); g.closePath();
            grad = g.createLinearGradient(0, -0.17 * L, 0, 0.17 * L);
            grad.addColorStop(0, '#8E8177'); grad.addColorStop(0.45, '#4A4038'); grad.addColorStop(1, '#1B1613');
            g.fillStyle = grad; g.fill();
            g.beginPath(); g.ellipse(-0.565 * L, 0, 0.028 * L, 0.163 * L, 0, 0, Math.PI * 2);
            grad = g.createLinearGradient(0, -0.16 * L, 0, 0.16 * L);
            grad.addColorStop(0, '#2A211C'); grad.addColorStop(0.5, '#0A0706'); grad.addColorStop(1, '#1A1310');
            g.fillStyle = grad; g.fill();

            // hull
            hullPath();
            grad = g.createLinearGradient(0, -0.185 * L, 0, 0.185 * L);
            grad.addColorStop(0, '#FFF8F0'); grad.addColorStop(0.16, '#F0E2D2');
            grad.addColorStop(0.42, '#CDB6A1'); grad.addColorStop(0.72, '#8A6653');
            grad.addColorStop(1, '#3E2C22');
            g.fillStyle = grad; g.fill();

            g.save(); g.clip();
            grad = g.createLinearGradient(0, -0.10 * L, 0, 0.02 * L);       // a specular band along the shoulder
            grad.addColorStop(0, 'rgba(255,255,255,0)'); grad.addColorStop(0.5, 'rgba(255,255,255,0.5)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = grad; g.fillRect(-0.6 * L, -0.10 * L, 1.2 * L, 0.12 * L);

            grad = g.createLinearGradient(0.24 * L, 0, 0.56 * L, 0);        // the nose cone
            grad.addColorStop(0, 'rgba(184, 83, 46, 0)'); grad.addColorStop(0.35, 'rgba(184, 83, 46, 0.92)');
            grad.addColorStop(1, 'rgba(226, 128, 82, 0.95)');
            g.fillStyle = grad; g.fillRect(0.24 * L, -0.2 * L, 0.34 * L, 0.4 * L);

            grad = g.createLinearGradient(-0.44 * L, 0, -0.16 * L, 0);      // a darker tail band
            grad.addColorStop(0, 'rgba(24, 16, 12, 0.55)'); grad.addColorStop(1, 'rgba(24, 16, 12, 0)');
            g.fillStyle = grad; g.fillRect(-0.46 * L, -0.2 * L, 0.32 * L, 0.4 * L);

            g.strokeStyle = 'rgba(38, 22, 14, 0.34)'; g.lineWidth = 1;      // panel lines
            [0.03, -0.16, -0.30].forEach(function (px) {
                g.beginPath(); g.moveTo(px * L, -0.2 * L);
                g.quadraticCurveTo((px + 0.03) * L, 0, px * L, 0.2 * L); g.stroke();
            });
            g.strokeStyle = 'rgba(255, 236, 214, 0.20)'; g.lineWidth = 0.8;
            [0.045, -0.145].forEach(function (px) {
                g.beginPath(); g.moveTo(px * L, -0.2 * L);
                g.quadraticCurveTo((px + 0.03) * L, 0, px * L, 0.2 * L); g.stroke();
            });
            g.restore();

            g.lineWidth = 1.3;                                              // rim light off the hole, above
            grad = g.createLinearGradient(0, -0.19 * L, 0, 0.05 * L);
            grad.addColorStop(0, 'rgba(255, 240, 220, 0.95)'); grad.addColorStop(1, 'rgba(255, 240, 220, 0)');
            hullPath(); g.strokeStyle = grad; g.stroke();
            grad = g.createLinearGradient(0, 0.02 * L, 0, 0.19 * L);        // bounce off the ground below
            grad.addColorStop(0, 'rgba(184, 83, 46, 0)'); grad.addColorStop(1, 'rgba(226, 128, 82, 0.55)');
            hullPath(); g.strokeStyle = grad; g.stroke();

            // canopy
            g.save();
            g.translate(0.19 * L, -0.022 * L); g.rotate(-0.12);
            g.beginPath(); g.ellipse(0, 0, 0.125 * L, 0.075 * L, 0, 0, Math.PI * 2);
            grad = g.createRadialGradient(-0.03 * L, -0.03 * L, 0.005 * L, 0, 0, 0.13 * L);
            grad.addColorStop(0, '#4E6B80'); grad.addColorStop(0.55, '#22323F'); grad.addColorStop(1, '#0E1620');
            g.fillStyle = grad; g.fill();
            g.save(); g.clip();
            g.beginPath(); g.ellipse(-0.04 * L, -0.05 * L, 0.10 * L, 0.035 * L, -0.35, 0, Math.PI * 2);
            g.fillStyle = 'rgba(255, 244, 232, 0.42)'; g.fill();
            g.restore();
            g.strokeStyle = 'rgba(255, 190, 140, 0.75)'; g.lineWidth = 1.1; g.stroke();
            g.restore();

            hullC = c; hullL = L;
            return { w: w, h: h, ox: 0.60 * L + pad, oy: 0.46 * L + pad };
        }
        var hullBox = null;
        function drawShip(alive) {
            var L = shipLen();
            if (!hullC || hullL !== L) hullBox = buildHull(L);
            var tilt = clamp(ship.vy / (VMAX * H), -1, 1) * 0.42;
            var shiver = thrusting && alive ? rand(-0.4, 0.4) : 0;
            ctx.save();
            ctx.translate(ship.x, ship.y + shiver);
            ctx.rotate(tilt);

            if (alive) {                                            // the plume, behind the nozzle
                var flick = 0.78 + 0.22 * Math.sin(clock * 41) * Math.sin(clock * 26.3);
                var f = thrusting ? L * (0.55 + 0.85 * flick) : L * 0.12 * flick;
                var mouth = -0.56 * L;
                ctx.globalCompositeOperation = 'lighter';
                var gr = f * 0.62 + L * 0.09;
                ctx.save();
                ctx.translate(mouth - f * 0.34, 0); ctx.scale(1.5, 0.62);
                var glow = ctx.createRadialGradient(0, 0, 0, 0, 0, gr);
                glow.addColorStop(0, 'rgba(255, 196, 140, ' + (thrusting ? 0.46 : 0.2) + ')');
                glow.addColorStop(0.5, 'rgba(255, 160, 95, ' + (thrusting ? 0.16 : 0.07) + ')');
                glow.addColorStop(1, 'rgba(255, 150, 80, 0)');
                ctx.fillStyle = glow;
                ctx.beginPath(); ctx.arc(0, 0, gr, 0, Math.PI * 2); ctx.fill();
                ctx.restore();
                if (thrusting) {
                    var cone = ctx.createLinearGradient(mouth, 0, mouth - f, 0);
                    cone.addColorStop(0, 'rgba(255, 248, 238, 0.95)');
                    cone.addColorStop(0.28, 'rgba(255, 196, 136, 0.72)');
                    cone.addColorStop(1, 'rgba(200, 90, 40, 0)');
                    ctx.beginPath();
                    ctx.moveTo(mouth, -0.14 * L);
                    ctx.quadraticCurveTo(mouth - f * 0.45, -0.09 * L, mouth - f, 0);
                    ctx.quadraticCurveTo(mouth - f * 0.45, 0.09 * L, mouth, 0.14 * L);
                    ctx.closePath();
                    ctx.fillStyle = cone; ctx.fill();
                    var core = ctx.createLinearGradient(mouth, 0, mouth - f * 0.55, 0);
                    core.addColorStop(0, 'rgba(255, 255, 252, 0.95)');
                    core.addColorStop(1, 'rgba(255, 226, 190, 0)');
                    ctx.beginPath();
                    ctx.moveTo(mouth, -0.062 * L);
                    ctx.quadraticCurveTo(mouth - f * 0.3, -0.03 * L, mouth - f * 0.55, 0);
                    ctx.quadraticCurveTo(mouth - f * 0.3, 0.03 * L, mouth, 0.062 * L);
                    ctx.closePath();
                    ctx.fillStyle = core; ctx.fill();
                    for (var d = 0; d < 3; d++) {                     // shock diamonds down the jet
                        var dt2 = 0.2 + d * 0.19, dr = (0.052 - d * 0.012) * L * flick;
                        ctx.beginPath();
                        ctx.ellipse(mouth - f * dt2, 0, dr * 1.5, dr, 0, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(255, 252, 246, ' + (0.5 - d * 0.13) + ')';
                        ctx.fill();
                    }
                }
                ctx.globalCompositeOperation = 'source-over';
            }

            ctx.drawImage(hullC, -hullBox.ox, -hullBox.oy, hullBox.w, hullBox.h);

            if (alive) {                                            // nav lights on the fin tips
                var beat = (clock % 1.6) < 0.16, beat2 = ((clock + 0.8) % 1.6) < 0.16;
                [[-0.45 * L, -0.42 * L, '#FF8A6A', beat], [-0.45 * L, 0.42 * L, '#EAF3FF', beat2]].forEach(function (n) {
                    if (!n[3]) return;
                    ctx.globalCompositeOperation = 'lighter';
                    var lg = ctx.createRadialGradient(n[0], n[1], 0, n[0], n[1], L * 0.11);
                    lg.addColorStop(0, n[2]); lg.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = lg;
                    ctx.beginPath(); ctx.arc(n[0], n[1], L * 0.11, 0, Math.PI * 2); ctx.fill();
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.fillStyle = '#FFFFFF';
                    ctx.beginPath(); ctx.arc(n[0], n[1], L * 0.016, 0, Math.PI * 2); ctx.fill();
                });
            }
            ctx.restore();
        }

        function render() {
            ctx.clearRect(0, 0, W, H);
            ctx.save();
            if (shake > 0) ctx.translate(rand(-1, 1) * shake * 9, rand(-1, 1) * shake * 9);

            var haze = ctx.createLinearGradient(0, H * 0.66, 0, H);
            haze.addColorStop(0, 'rgba(255, 174, 106, 0)');
            haze.addColorStop(0.75, 'rgba(184, 83, 46, 0.12)');
            haze.addColorStop(1, 'rgba(184, 83, 46, 0.16)');
            ctx.fillStyle = haze; ctx.fillRect(0, H * 0.66, W, H * 0.34);
            drawTerrain(back, ['rgba(60, 42, 31, 0.9)', 'rgba(12, 8, 6, 0.96)'], 'rgba(184, 83, 46, 0.38)');
            drawTerrain(front, ['#3B2A1F', '#090605'], 'rgba(255, 174, 106, 0.66)');

            var i;
            for (i = 0; i < cores.length; i++) drawCore(cores[i]);
            for (i = 0; i < rocks.length; i++) drawRock(rocks[i]);
            for (i = 0; i < bits.length; i++) {
                var b2 = bits[i], k = 1 - b2.age / b2.life;
                ctx.globalAlpha = Math.max(0, k);
                ctx.fillStyle = b2.warm ? '#FFC088' : '#8A6552';
                ctx.beginPath(); ctx.arc(b2.x, b2.y, b2.r * (0.4 + k * 0.6), 0, Math.PI * 2); ctx.fill();
            }
            ctx.globalAlpha = 1;
            if (state !== 'over') drawShip(state === 'running');

            ctx.restore();

            if (state === 'idle' || state === 'over') {
                var ink = css('--text', '#F2EAE0'), dim = css('--text-3', '#896653');
                ctx.textAlign = 'center';
                ctx.fillStyle = ink;
                ctx.font = '600 ' + Math.round(clamp(H * 0.052, 20, 34)) + 'px "Space Grotesk", sans-serif';
                var ty = H * 0.19;
                ctx.fillText(state === 'idle' ? 'Orbit' : 'Lost to the rocks', W / 2, ty);
                ctx.fillStyle = dim;
                ctx.font = '500 ' + Math.round(clamp(H * 0.024, 11, 14)) + 'px "JetBrains Mono", monospace';
                ctx.fillText(state === 'idle' ? (TOUCH ? 'HOLD TO FLY · AVOID THE ROCKS' : 'HOLD SPACE TO FLY · AVOID THE ROCKS')
                                              : 'SCORE ' + score + '   ·   ' + GO.toUpperCase(), W / 2, ty + clamp(H * 0.045, 22, 32));
            }
            scoreEl.textContent = (state === 'idle' && !best) ? '' : 'score ' + score + ' · best ' + best;
        }

        /* ── Loop ───────────────────────────────────────────────────── */
        var last = 0;
        function loop(now) {
            var dt = last ? Math.min(0.05, (now - last) / 1000) : 0.016;
            last = now;
            update(dt);
            render();
            requestAnimationFrame(loop);
        }
        resize();
        reset();
        state = 'idle';
        bar.textContent = TOUCH ? 'hold to fly · avoid the rocks' : 'hold space to fly · avoid the rocks';
        requestAnimationFrame(loop);

        window.__game = {                                  // for the tests: what the rocket is doing
            state: function () { return state; },
            y: function () { return ship.y; },
            vy: function () { return ship.vy; },
            score: function () { return score; },
            best: function () { return best; },
            height: function () { return H; }
        };
    })();
    </script>

</body>
</html>
